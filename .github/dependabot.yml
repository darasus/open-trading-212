version: 2
updates:
  # Minor and patch bumps arrive as one weekly PR; each major bump gets its own.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # @types/node tracks the Node version CI and releases run on (22), not the newest Node.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  # Keeps the SHA-pinned actions in the workflows current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
