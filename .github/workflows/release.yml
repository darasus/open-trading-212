name: Release

# Builds signed installers and publishes a GitHub Release for the version in package.json.
# Either push a `vX.Y.Z` tag, or run it from the Actions tab on main, which tags the commit
# itself. Signing secrets are optional (see README, Releasing): without them macOS is signed
# ad hoc and Windows is unsigned.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Create the draft once, up front. When both build jobs race to create it, GitHub ends up
  # with two drafts for the same tag and the assets split between them.
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve the tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v$VERSION"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$GITHUB_REF_NAME" != "$TAG" ]; then
              echo "Tag $GITHUB_REF_NAME does not match package.json version $VERSION" >&2
              exit 1
            fi
          elif [ "$GITHUB_REF_NAME" = main ]; then
            # Run from the Actions tab: tag this commit, unless the version is already taken.
            # A tag made with GITHUB_TOKEN doesn't start another run of this workflow.
            # `gh api` prints GitHub's error JSON on stdout when the tag is missing, so test the
            # exit status before reading a commit out of it.
            EXISTING=""
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
              EXISTING="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)"
            fi
            if [ -z "$EXISTING" ]; then
              gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" >/dev/null
              echo "Tagged $GITHUB_SHA as $TAG"
            elif [ "$EXISTING" != "$GITHUB_SHA" ]; then
              echo "$TAG is already released from another commit. Bump version in package.json first." >&2
              exit 1
            fi
          else
            echo "Run this from main, or push a v* tag. $GITHUB_REF_NAME is neither." >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --verify-tag --title "open-trading-212 ${TAG#v}" --notes ""

  macos:
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # Node still runs the toolchain: electron-vite, vitest and electron-builder.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Build and publish (macOS)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          # An empty CSC_LINK makes electron-builder try to open "" as a certificate file, so
          # drop the signing variables entirely when the secrets are not configured.
          NOTARIZE=false
          SIGN_ARGS=()
          if [ -n "$CSC_LINK" ] && [ -n "$APPLE_ID" ]; then
            NOTARIZE=true
            # Import the certificate into our own keychain rather than letting electron-builder do
            # it: 26.x unlocks its keychain with the .p12 password in set-key-partition-list, which
            # fails with "The user name or passphrase you entered is not correct".
            KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
            KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
            echo "::add-mask::$KEYCHAIN_PASSWORD"
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security set-keychain-settings -lut 21600 "$KEYCHAIN"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            base64 --decode <<<"$CSC_LINK" >"$RUNNER_TEMP/signing.p12"
            security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
            rm "$RUNNER_TEMP/signing.p12"
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
            security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
            IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"Developer ID Application: \(.*\)"$/\1/p' | head -n 1)"
            if [ -z "$IDENTITY" ]; then
              echo "No valid Developer ID Application identity in MAC_CSC_LINK" >&2
              exit 1
            fi
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_KEYCHAIN="$KEYCHAIN" CSC_NAME="$IDENTITY"
          else
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            # Sign ad hoc instead. Left unsigned, the bundle's signature is broken and Apple silicon
            # reports the app as "damaged"; ad hoc, the user can approve it in Privacy & Security.
            # Hardened runtime only matters for notarization, and ad hoc it needs extra entitlements.
            SIGN_ARGS=(--config.mac.identity=- --config.mac.hardenedRuntime=false)
          fi
          bun run typecheck
          bun run electron-vite build
          bun run electron-builder --mac --publish always --config.mac.notarize=$NOTARIZE "${SIGN_ARGS[@]}"

  windows:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # Node still runs the toolchain: electron-vite, vitest and electron-builder.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Build and publish (Windows)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Azure Artifact Signing (formerly Trusted Signing). Code signing keys must live on
          # hardware now, so a .p12 in CSC_LINK no longer works for Windows. The service principal
          # needs the "Artifact Signing Certificate Profile Signer" role on the signing account.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          AZURE_SIGNING_PUBLISHER: ${{ vars.AZURE_SIGNING_PUBLISHER }}
        shell: bash
        run: |
          SIGN_ARGS=()
          if [ -n "$AZURE_CLIENT_SECRET" ] && [ -n "$AZURE_SIGNING_ENDPOINT" ]; then
            # publisherName must match the certificate's CN exactly: electron-updater checks it
            # before installing an update, so later releases must be signed by the same identity.
            SIGN_ARGS=(
              "--config.win.azureSignOptions.endpoint=$AZURE_SIGNING_ENDPOINT"
              "--config.win.azureSignOptions.codeSigningAccountName=$AZURE_SIGNING_ACCOUNT"
              "--config.win.azureSignOptions.certificateProfileName=$AZURE_SIGNING_PROFILE"
              "--config.win.azureSignOptions.publisherName=$AZURE_SIGNING_PUBLISHER"
            )
          else
            unset AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET
          fi
          bun run typecheck
          bun run electron-vite build
          bun run electron-builder --win --publish always "${SIGN_ARGS[@]}"

  publish:
    needs: [prepare, macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "$TAG" --draft=false
