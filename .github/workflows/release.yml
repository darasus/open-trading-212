name: Release

# Tag a commit `vX.Y.Z` (matching package.json) to build signed installers and publish a
# GitHub Release. Signing secrets are optional: without them the build is unsigned.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Create the draft once, up front. When both build jobs race to create it, GitHub ends up
  # with two drafts for the same tag and the assets split between them.
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Tag $TAG does not match package.json version $VERSION" >&2
            exit 1
          fi
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --title "open-trading-212 $VERSION" --notes ""

  macos:
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # Node still runs the toolchain: electron-vite, vitest and electron-builder.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Build and publish (macOS)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          # An empty CSC_LINK makes electron-builder try to open "" as a certificate file, so
          # drop the signing variables entirely when the secrets are not configured.
          NOTARIZE=false
          SIGN_ARGS=()
          if [ -n "$CSC_LINK" ] && [ -n "$APPLE_ID" ]; then
            NOTARIZE=true
          else
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            # Sign ad hoc instead. Left unsigned, the bundle's signature is broken and Apple silicon
            # reports the app as "damaged"; ad hoc, the user can approve it in Privacy & Security.
            # Hardened runtime only matters for notarization, and ad hoc it needs extra entitlements.
            SIGN_ARGS=(--config.mac.identity=- --config.mac.hardenedRuntime=false)
          fi
          bun run typecheck
          bun run electron-vite build
          bun run electron-builder --mac --publish always --config.mac.notarize=$NOTARIZE "${SIGN_ARGS[@]}"

  windows:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # Node still runs the toolchain: electron-vite, vitest and electron-builder.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Build and publish (Windows)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$CSC_LINK" ]; then unset CSC_LINK CSC_KEY_PASSWORD; fi
          bun run typecheck
          bun run electron-vite build
          bun run electron-builder --win --publish always

  publish:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false
